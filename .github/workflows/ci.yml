name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its older run. Pushes to main each get their
  # own group, so every commit on main is tested.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  PY_COLORS: "1" # color pytest's output; FORCE_COLOR would also turn on pip's progress bars
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install ruff (version pinned in requirements-dev.txt)
        run: python -m pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Every CPython release still supported upstream. On 3.10, requirements-dev.txt
        # installs pandas 2 and IPython 8, so both major versions stay tested.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Each src/aws_analyzer/<service>.py must work when copied into a notebook by itself, with
      # boto3 as its only hard dependency (pandas, pyarrow and IPython are optional).
      - name: Import each analyzer on its own with only boto3 installed
        run: |
          python -m pip install "$(grep -E '^boto3==' requirements-dev.txt)"
          for file in src/aws_analyzer/*.py; do
            [ "$(basename "$file")" = __init__.py ] && continue
            dir="$(mktemp -d)"
            cp "$file" "$dir/"
            (cd "$dir" && python -c "import $(basename "$file" .py)")
            echo "ok: $file"
          done
      - name: Install dev requirements
        run: python -m pip install -r requirements-dev.txt
      - name: Pytest
        run: python -m pytest

  # The PyPI package (pyproject.toml): build it the way the release workflow does, and check
  # that `pip install aws-analyzer` gives a notebook every module with only boto3 installed.
  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install build and twine (versions pinned in requirements-dev.txt)
        run: >-
          python -m pip install
          "$(grep -E '^build==' requirements-dev.txt)"
          "$(grep -E '^twine==' requirements-dev.txt)"
          "$(grep -E '^readme-renderer\[md\]==' requirements-dev.txt)"
      - name: Build the sdist, and the wheel from it
        run: python -m build
      - name: Check the metadata, and that the README renders on PyPI
        run: twine check --strict dist/*
      - name: Install the wheel with only boto3 and import every module
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install "$(grep -E '^boto3==' requirements-dev.txt)" dist/*.whl
          cd "$RUNNER_TEMP" && "$RUNNER_TEMP/wheel/bin/python" -c "$SMOKE"
        env:
          SMOKE: |
            import aws_analyzer
            from aws_analyzer import s3, s3_explorer
            for name in aws_analyzer.__all__[1:]:
                getattr(aws_analyzer, name)
            assert s3_explorer._s3_module() is s3, "S3Explorer should build on aws_analyzer.s3"
            print(f"aws-analyzer {aws_analyzer.__version__}: every module imports with only boto3")

  # One stable status to require in branch protection, so the rule doesn't need editing
  # when the Python matrix changes.
  ci-result:
    name: CI result
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that lint and every test job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
