# Lint for real errors (pyflakes plus pycodestyle's error checks), not style. The rules
# are listed explicitly so a ruff upgrade from Dependabot can't change them: ruff 0.16
# grew its default set from about 60 rules to over 400.

# Oldest Python in the CI matrix; ruff flags syntax that doesn't exist there yet.
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F"]
