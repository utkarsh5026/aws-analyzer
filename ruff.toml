# Lint for real errors (pyflakes plus pycodestyle's error checks), and for the code style rules in CLAUDE.md that
# ruff can check: mutable default arguments (B006), errors swallowed by a broad except (BLE001), commented-out code
# (ERA001), and functions that are too complex (C901), take too many arguments (PLR0913), branch too much (PLR0912)
# or run too long (PLR0915). The rules are listed explicitly so a ruff upgrade from Dependabot can't change them:
# ruff 0.16 grew its default set from about 60 rules to over 400.
#
# The two rules ruff can't check, docstrings with their quotes on their own lines and no new # comments, are
# tests/test_style.py.

# Oldest Python in the CI matrix; ruff flags syntax that doesn't exist there yet.
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "B006", "BLE001", "ERA001", "C901", "PLR0912", "PLR0913", "PLR0915"]

# Code written before the style rules: each file keeps the rules it already broke until it's cleaned up. Take a
# rule off a file once nothing in it breaks that rule any more, so it can't come back; never add a file or a rule.
# Pytest fixtures arrive as arguments, so tests may take as many as they need.
[lint.per-file-ignores]
"tests/**" = ["PLR0913"]
".claude/skills/check/rules.py" = ["BLE001", "C901", "PLR0912", "PLR0913", "PLR0915"]
