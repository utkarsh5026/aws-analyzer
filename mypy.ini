# For the editor's mypy (the VS Code Mypy extension). CI doesn't run mypy; it runs ruff and pytest.

[mypy]
# Tests import each analyzer the way a notebook does (`import s3`), with tests/conftest.py
# putting analyzers/ on sys.path. mypy needs the same path to resolve those imports.
mypy_path = analyzers

# These packages ship without type hints, and their stubs (boto3-stubs, pandas-stubs, ...)
# aren't installed. compression.zstd is stdlib from Python 3.14 only.
[mypy-boto3.*,botocore.*,moto.*,pandas.*,pyarrow.*,fastavro.*,compression.*]
ignore_missing_imports = True
